<!DOCTYPE html>
<html lang="en" data-i18n-scope="index">
	<head>
		<!-- Meta -->
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

		<!-- Theme Color -->
		<meta name="theme-color" content="#5AB8F5" media="(prefers-color-scheme: light)">
		<meta name="theme-color" content="#5AB8F5" media="(prefers-color-scheme: dark)">

		<!-- Primary Meta Tags -->
		<title>KapturNaSłuch</title>
		<meta name="description" content="Content creator and audio enthusiast. Probably the most controversial sound-related creator on the Polish internet.">

		<!-- Embed card -->
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="KapturNaSłuch">
		<meta property="og:title" content="KapturNaSłuch - Home Page">
		<meta property="og:description" content="Content creator and audio enthusiast. Probably the most controversial sound-related creator on the Polish internet.">
		<meta property="og:image" content="https://kapturnasluch.github.io/assets/resources/img/png/banner_home_thin.png">
		<meta property="og:url" content="https://kapturnasluch.github.io">

		<!-- X Card -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="KapturNaSłuch - Home Page">
		<meta name="twitter:description" content="Content creator and audio enthusiast. Probably the most controversial sound-related creator on the Polish internet.">
		<meta name="twitter:image" content="https://kapturnasluch.github.io/assets/resources/img/png/banner_home_thin.png">

		<!-- Icons -->
		<link rel="icon" type="image/png" href="assets/resources/img/png/icon.png"/>

		<!-- CSS -->
		<link rel="stylesheet" href="assets/code/css/global.css"/>
		<link rel="stylesheet" href="assets/code/css/main.css"/>
	</head>
	<body id="top">
		<nav class="header" style="background: initial; position: fixed; border: initial;"></nav>

		<main>
			<section class="hero">
				<div class="hero-header">
					<img src="assets/resources/img/png/icon.png" class="hero-avatar" alt="KapturNaSluch"/>
					<h1 class="hero-name">Kaptur<span class="accent-word">Na</span>Słuch</h1>
				</div>
				<p class="hero-taglines">
					<span data-i18n="hero_tagline1"></span>
					<span data-i18n="hero_tagline2"></span>
				</p>
				<p class="hero-desc" data-i18n="hero_desc"></p>
				<a href="#bottom" class="btn-primary" data-i18n="hero_cta"></a>
			</section>
		</main>

		<footer id="bottom" class="footer"></footer>

		<div class="background">
			<div class="background-media">
				<video autoplay muted playsinline
					   data-playlist='[
						   "assets/resources/vid/mp4/1.mp4",
						   "assets/resources/vid/mp4/2.mp4",
						   "assets/resources/vid/mp4/3.mp4",
						   "assets/resources/vid/mp4/4.mp4",
						   "assets/resources/vid/mp4/5.mp4"
					   ]'></video>
			</div>
		</div>

		<script src="assets/code/js/utils.js"></script>
		<script src="assets/code/js/emoji.js"></script>
		<script src="assets/code/js/translations.js"></script>
		<script src="assets/code/js/i18n.js"></script>
		<script src="assets/code/js/locale.js"></script>
		<script src="assets/code/js/icons.js"></script>
		<script src="assets/code/js/theme.js"></script>
		<script src="assets/code/js/components.js"></script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				loadComponent(".header", "assets/code/html/header.html", "", () => {
					applyTranslations();
					updateMobileNavIcon("closed");
				});
				loadComponent(".footer", "assets/code/html/footer.html", "", applyTranslations);

				setDocumentTitle();
			});
		</script>
		<script src="assets/code/js/video.js"></script>
	</body>
</html>
