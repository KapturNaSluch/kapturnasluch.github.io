<a href="{root}" class="header-brand">
	<div class="header-logo-img">
		<div class="header-logo-img-frame"></div>
		<div class="header-logo-img-photo">
			<img src="{root}/assets/resources/img/svg/hero.svg"/>
		</div>
	</div>

	<span class="logo">Kaptur<span>Na</span>Słuch</span>
</a>

<button class="header-toggle-btn" onclick="toggleMobileHeader()">
	<span class="toggle-icon">line-md:menu|(≡)</span>
</button>

<div class="header-controls">
	<ul class="header-links capitalized">
		<li>
			<a href="{root}" class="header-home-link">
				<span class="header-link-icon">line-md:home-md|(🏠)</span>
				<span data-i18n="nav_home"></span>
			</a>
		</li>
		<li>
			<a href="{root}/resources" class="header-res-link">
				<span class="header-link-icon">line-md:clipboard-list|(📚)</span>
				<span data-i18n="nav_resources"></span>
			</a>
		</li>
		<li>
			<a href="{root}/about">
				<span class="header-link-icon">line-md:question-circle|(📕)</span>
				<span data-i18n="nav_about"></span>
			</a>
		</li>
	</ul>
	<div class="header-options">
		<button class="theme-toggle btn-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
			<span class="theme-icon is-loading">☀️</span>
		</button>

		<div class="lang-picker">
			<button class="lang-toggle btn-toggle" onclick="toggleLangPicker()" aria-label="Select language">
				<span class="lang-icon is-loading"></span>
			</button>

			<div class="lang-dropdown" role="listbox" aria-label="Language"></div>
		</div>
	</div>
</div>
